name: skills

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io
          fi
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
          fi

      - name: Build
        run: |
          docker build -f docker/skills.Dockerfile \
            -t disglair.local:3003/skills:${{ gitea.sha }} \
            -t disglair.local:3003/skills:latest .

      - name: Push
        run: |
          docker push disglair.local:3003/skills:${{ gitea.sha }}
          docker push disglair.local:3003/skills:latest

      - name: Keep five newest images
        run: uv run rotate-skills
