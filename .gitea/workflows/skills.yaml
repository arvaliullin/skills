name: skills

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io python3-docker
          elif ! python3 -c "import docker" >/dev/null 2>&1; then
            apt-get update
            apt-get install -y python3-docker
          fi

      - name: Build
        run: |
          docker build -f docker/skills.Dockerfile \
            -t disglair.local:3003/skills:${{ gitea.sha }} \
            -t disglair.local:3003/skills:latest .

      - name: Push
        run: |
          docker push disglair.local:3003/skills:${{ gitea.sha }}
          docker push disglair.local:3003/skills:latest

      - name: Keep five newest images
        run: python3 scripts/skills/rotate_registry.py
